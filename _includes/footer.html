<footer class="footer border-top py-2 mt-5 bg-white shadow">
    <div class="container">
        <div class="row my-2">
            <div class="col-md-4">
                <div class="text-muted">
                    <i>Last updated: {{ "now" | date: "%b %Y" }}</i>                    
                </div>
            </div>
            <div class="col-md-8">
                <div class="d-md-none">
                    <div class="text-muted small">
                        {{ site.data.display.footer_text }}
                    </div>
                </div>
                <div class="d-none d-md-block">
                    <div class="text-right text-muted">
                        {{ site.data.display.footer_text }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</footer>
