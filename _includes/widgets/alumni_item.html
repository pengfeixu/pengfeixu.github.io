{% assign item = include.item %}
<span class="group-alum-pill{% if item.honor %} group-alum-pill-honor{% endif %}"{% if item.remark %} data-toggle="tooltip" data-placement="top" title="{{ item.remark }}"{% endif %}>
    {% if item.homepage %}
    <a class="group-alum-name" href="{{ item.homepage }}" target="_blank" rel="noopener noreferrer">{{ item.name }}</a>
    {% else %}
    <span class="group-alum-name">{{ item.name }}</span>
    {% endif %}
    {% if item.honor %}
    <span class="group-alum-honor" data-toggle="tooltip" data-placement="top" title="{{ item.honor }}" role="img" aria-label="{{ item.honor }}"><i class="fa fa-trophy" aria-hidden="true"></i></span>
    {% endif %}
    {% if item.work %}
    <span class="group-alum-sep" aria-hidden="true">&middot;</span>
    <span class="group-alum-dest">{{ item.work }}</span>
    {% endif %}
</span>
